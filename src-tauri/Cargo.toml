[package]
name = "ai-workspace"
version = "0.2.0"
description = "A private pixel office for AI activity"
authors = ["AI Workspace contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "ai_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
getrandom = "0.4"
sha2 = "0.10"
subtle = "2.6"
sysinfo = "0.37"

[dev-dependencies]
tempfile = "3"
