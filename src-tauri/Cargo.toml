[package]
name = "ai-workspace"
version = "0.1.0"
description = "A private pixel office for AI activity"
authors = ["AI Workspace contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "ai_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
