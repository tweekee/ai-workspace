name: Validate AI Workspace
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validation-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: playwright-report/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo build --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - run: npm run monitor:test
      - uses: actions/upload-artifact@v4
        with:
          name: ai-workspace-chrome-extension
          path: browser-extension/
          if-no-files-found: error
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: ai-workspace-windows-preview
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
